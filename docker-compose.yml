version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: infra-editor-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra_editor}
      POSTGRES_USER: ${POSTGRES_USER:-editor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editor_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-editor_user} -d $${POSTGRES_DB:-infra_editor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infra-editor-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra_editor}
      POSTGRES_USER: ${POSTGRES_USER:-editor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editor_password}
      DB_HOST: db
      DB_PORT: 5432
      APP_PORT: ${APP_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-infra_editor}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-editor_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-editor_password}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
