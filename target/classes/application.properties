spring.application.name=infra-editor

server.port=${APP_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:infra_editor}}
spring.datasource.username=${POSTGRES_USER:editor_user}
spring.datasource.password=${POSTGRES_PASSWORD:editor_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
